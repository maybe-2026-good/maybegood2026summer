<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>りゅうせい監禁事件</title>

<style>

/* =====================================================
   基本
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #111;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
}

button {
    font-family: inherit;
}


/* =====================================================
   共通画面
===================================================== */

.screen {
    width: 100%;
    min-height: 100vh;

    display: none;
}

.screen.active {
    display: flex;
}


/* =====================================================
   戻るボタン
===================================================== */

.back-button {
    position: absolute;

    top: 18px;
    left: 18px;

    z-index: 100;

    border: none;
    background: transparent;

    color: white;

    font-size: 32px;

    cursor: pointer;
}


/* =====================================================
   タイトル
===================================================== */

#titleScreen {

    background:
        radial-gradient(
            circle at center,
            #333 0%,
            #111 70%
        );

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;
}

.title-small {

    font-size: 14px;

    letter-spacing: 5px;

    opacity: .6;

    margin-bottom: 25px;
}

.main-title {

    font-size:
        clamp(40px, 10vw, 70px);

    line-height: 1.3;

    letter-spacing: 5px;

    margin: 0 0 60px;
}

.start-button {

    width: 240px;

    padding: 18px;

    border:
        1px solid white;

    background: transparent;

    color: white;

    border-radius: 5px;

    font-size: 18px;

    cursor: pointer;
}


/* =====================================================
   メニュー
===================================================== */

#menuScreen {

    background: #181818;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 30px;
}

.page-title {

    font-size: 30px;

    margin-bottom: 45px;

    text-align: center;
}

.menu-button {

    width:
        min(500px, 90vw);

    padding: 22px;

    margin: 10px;

    background: #252525;

    color: white;

    border:
        1px solid #555;

    border-radius: 10px;

    font-size: 18px;

    cursor: pointer;
}


/* =====================================================
   選択画面
===================================================== */

.selection-screen {

    position: relative;

    background: #181818;

    flex-direction: column;

    align-items: center;

    padding:
        80px 20px 40px;
}

.selection-grid {

    width:
        min(600px, 95vw);

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;
}

.selection-button {

    min-height: 120px;

    background: #292929;

    color: white;

    border:
        1px solid #555;

    border-radius: 12px;

    font-size: 20px;

    cursor: pointer;
}

.selection-button span {

    display: block;

    font-size: 14px;

    opacity: .6;

    margin-bottom: 10px;
}


/* =====================================================
   部屋暗証番号
===================================================== */

.password-screen {

    position: relative;

    background: #181818;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}

.password-title {

    font-size: 18px;

    margin-bottom: 20px;

    text-align: center;
}

.pin-display {

    display: flex;

    gap: 18px;

    margin-bottom: 35px;
}

.pin-dot {

    width: 15px;
    height: 15px;

    border:
        2px solid white;

    border-radius: 50%;
}

.pin-dot.filled {

    background: white;
}


/*
   ★ 部屋の数字ボタン
   スマホと同じ完全な円
*/

.number-pad {

    width: 280px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;
}

.number-button {

    width: 75px;
    height: 75px;

    margin: auto;

    border: none;

    border-radius: 50%;

    background: #333;

    color: white;

    font-size: 25px;

    cursor: pointer;
}

.number-button:active {

    background: #666;
}

.pin-message {

    margin-top: 25px;

    text-align: center;

    line-height: 1.8;
}


/* =====================================================
   部屋調査成功画面
===================================================== */

#roomSuccessScreen {

    position: relative;

    background:
        radial-gradient(
            circle,
            #333,
            #111
        );

    align-items: center;

    justify-content: center;

    flex-direction: column;

    padding: 30px;

    text-align: center;
}

.success-sound {

    font-size: 25px;

    margin-bottom: 25px;
}

.success-title {

    font-size: 28px;

    margin-bottom: 30px;
}

.success-message {

    max-width: 600px;

    line-height: 2;

    font-size: 16px;
}

.investigate-button {

    margin-top: 35px;

    padding: 15px 35px;

    background: white;

    color: black;

    border: none;

    border-radius: 8px;

    font-size: 16px;
}


/* =====================================================
   スマホ全体
===================================================== */

.phone-wrapper {

    width: 100%;

    min-height: 100vh;

    background: #111;

    display: flex;

    justify-content: center;

    align-items: center;
}

.phone {

    width:
        min(390px, 100vw);

    height:
        min(844px, 100vh);

    position: relative;

    overflow: hidden;

    background: #000;
}


/* =====================================================
   スマホ外部へ戻る
===================================================== */

.phone-list-back {

    position: absolute;

    top: 18px;
    left: 18px;

    z-index: 1000;

    border: none;

    background:
        rgba(0,0,0,.45);

    color: white;

    border-radius: 50%;

    width: 40px;
    height: 40px;

    font-size: 28px;

    cursor: pointer;
}


/* =====================================================
   ロック画面
===================================================== */

.lock-screen {

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            #222,
            #111
        );

    background-size: cover;

    background-position: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: space-between;

    padding:
        80px 20px 35px;

    z-index: 20;
}

.lock-time {

    font-size: 72px;

    font-weight: 200;
}

.lock-date {

    text-align: center;

    font-size: 18px;

    margin-top: -40px;
}

.swipe-area {

    text-align: center;

    font-size: 14px;

    opacity: .8;

    animation:
        swipe 2s infinite;
}

@keyframes swipe {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


/* =====================================================
   スマホパスコード
===================================================== */

.passcode-screen {

    position: absolute;

    inset: 0;

    background: #111;

    z-index: 15;

    display: none;

    flex-direction: column;

    align-items: center;

    padding-top: 100px;
}

.passcode-screen.active {

    display: flex;
}

.passcode-title {

    font-size: 22px;

    margin-bottom: 20px;
}

.passcode-dots {

    display: flex;

    gap: 18px;

    margin-bottom: 25px;
}

.pass-dot {

    width: 12px;
    height: 12px;

    border:
        1px solid white;

    border-radius: 50%;
}

.pass-dot.filled {

    background: white;
}

.forgot-button {

    background: transparent;

    border: none;

    color: #aaa;

    margin-bottom: 25px;

    cursor: pointer;
}

.forgot-message {

    width: 85%;

    background: #222;

    border-radius: 10px;

    padding: 15px;

    text-align: center;

    display: none;

    margin-bottom: 20px;

    font-size: 14px;

    line-height: 1.7;
}

.forgot-message.show {

    display: block;
}


/* =====================================================
   スマホ数字
===================================================== */

.phone-keypad {

    width: 280px;

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 12px;
}

.phone-key {

    width: 75px;
    height: 75px;

    margin: auto;

    border-radius: 50%;

    border: none;

    background: #292929;

    color: white;

    font-size: 25px;
}


/* =====================================================
   ホーム
===================================================== */

.home-screen {

    position: absolute;

    inset: 0;

    display: none;

    flex-direction: column;

    background:
        linear-gradient(
            #444,
            #111
        );

    background-size: cover;

    background-position: center;

    padding:
        55px 20px 30px;
}

.home-screen.active {

    display: flex;
}

.status-bar {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    font-size: 13px;

    z-index: 10;
}

.app-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 25px 15px;

    margin-top: 20px;
}

.app-icon {

    display: flex;

    flex-direction: column;

    align-items: center;

    border: none;

    background: transparent;

    color: white;

    cursor: pointer;
}

.app-icon-image {

    width: 58px;
    height: 58px;

    border-radius: 14px;

    background: #333;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 28px;

    margin-bottom: 5px;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.4);
}

.app-name {

    font-size: 11px;

    text-shadow:
        0 1px 4px black;
}


/* =====================================================
   アプリ
===================================================== */

.app-screen {

    position: absolute;

    inset: 0;

    background: #f5f5f5;

    color: #111;

    display: none;

    z-index: 50;
}

.app-screen.active {

    display: block;
}

.app-header {

    height: 70px;

    background: white;

    border-bottom:
        1px solid #ddd;

    display: flex;

    align-items: center;

    padding: 0 15px;

    font-weight: bold;

    font-size: 18px;
}

.app-back {

    border: none;

    background: transparent;

    font-size: 30px;

    margin-right: 10px;

    cursor: pointer;
}


/*
   ★ 画像表示アプリ
*/

.image-app-content {

    width: 100%;

    height:
        calc(100% - 70px);

    overflow-y: auto;

    display: flex;

    align-items: flex-start;

    justify-content: center;

    background: #111;
}

.image-app-content img {

    width: 100%;

    height: auto;

    display: block;

    object-fit: contain;
}


/* =====================================================
   LINE
===================================================== */

.line-screen {

    background: white;
}

.line-list {

    padding: 10px 0;
}

.line-person {

    width: 100%;

    border: none;

    background: white;

    border-bottom:
        1px solid #ddd;

    padding: 15px;

    display: flex;

    align-items: center;

    cursor: pointer;

    text-align: left;
}

.line-avatar {

    width: 50px;
    height: 50px;

    border-radius: 50%;

    background: #ccc;

    margin-right: 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #555;

    font-size: 20px;
}

.line-person-name {

    font-size: 16px;
}


/*
   LINEチャット
*/

.line-chat {

    display: none;

    position: absolute;

    inset: 0;

    background: #e8e8e8;

    z-index: 100;
}

.line-chat.active {

    display: block;
}

.line-chat-header {

    height: 70px;

    background: white;

    border-bottom:
        1px solid #ccc;

    display: flex;

    align-items: center;

    padding: 0 15px;
}

.chat-image-wrapper {

    height:
        calc(100% - 70px);

    overflow-y: auto;

    background: #111;

    display: flex;

    justify-content: center;

    align-items: flex-start;
}

.chat-image-wrapper img {

    width: 100%;

    height: auto;

    display: block;
}


/* =====================================================
   戻る
===================================================== */

.home-back-button {

    position: absolute;

    top: 15px;
    left: 15px;

    border: none;

    background:
        rgba(0,0,0,.5);

    color: white;

    border-radius: 50%;

    width: 40px;
    height: 40px;

    font-size: 28px;

    z-index: 200;
}


/* =====================================================
   スマホ
===================================================== */

@media(max-width:500px) {

    .phone {

        width: 100vw;

        height: 100vh;
    }

    .selection-grid {

        grid-template-columns:
            1fr;
    }

    .selection-button {

        min-height: 90px;
    }
}

</style>

</head>


<body>

<div id="app">


<!-- =====================================================
     タイトル
===================================================== -->

<section
    id="titleScreen"
    class="screen active">

    <div class="title-small">
        MAYBEGOOD MYSTERY
    </div>

    <h1 class="main-title">
        りゅうせい<br>
        監禁事件
    </h1>

    <button
        class="start-button"
        onclick="showScreen('menuScreen')">

        START

    </button>

</section>


<!-- =====================================================
     メニュー
===================================================== -->

<section
    id="menuScreen"
    class="screen">

    <button
        class="back-button"
        onclick="showScreen('titleScreen')">

        ‹

    </button>

    <h2 class="page-title">
        捜査メニュー
    </h2>


    <button
        class="menu-button"
        onclick="showScreen('roomSelectScreen')">

        🏨 容疑者の部屋を調べる

    </button>


    <button
        class="menu-button"
        onclick="showScreen('phoneSelectScreen')">

        📱 容疑者のスマホを調べる

    </button>

</section>


<!-- =====================================================
     部屋選択
===================================================== -->

<section
    id="roomSelectScreen"
    class="screen selection-screen">

    <button
        class="back-button"
        onclick="showScreen('menuScreen')">

        ‹

    </button>


    <h2 class="page-title">
        容疑者の部屋を調べる
    </h2>


    <div class="selection-grid">


        <button
            class="selection-button"
            onclick="openRoom('みさ','101')">

            <span>101号室</span>

            みさの部屋

        </button>


        <button
            class="selection-button"
            onclick="openRoom('りんたろう','102')">

            <span>102号室</span>

            りんたろうの部屋

        </button>


        <button
            class="selection-button"
            onclick="openRoom('ゆうき','202')">

            <span>202号室</span>

            ゆうきの部屋

        </button>


        <button
            class="selection-button"
            onclick="openRoom('わたる','203')">

            <span>203号室</span>

            わたるの部屋

        </button>

    </div>

</section>


<!-- =====================================================
     部屋パスワード
===================================================== -->

<section
    id="roomPasswordScreen"
    class="screen password-screen">


    <button
        class="back-button"
        onclick="showScreen('roomSelectScreen')">

        ‹

    </button>


    <div class="password-title">

        <span id="roomNumberText"></span>号室

    </div>


    <div class="password-title">

        暗証番号を入力してください

    </div>


    <div class="pin-display">

        <div
            class="pin-dot"
            id="roomPin1">
        </div>

        <div
            class="pin-dot"
            id="roomPin2">
        </div>

        <div
            class="pin-dot"
            id="roomPin3">
        </div>

        <div
            class="pin-dot"
            id="roomPin4">
        </div>

    </div>


    <div class="number-pad">

        <button
            class="number-button"
            onclick="roomInput(1)">1</button>

        <button
            class="number-button"
            onclick="roomInput(2)">2</button>

        <button
            class="number-button"
            onclick="roomInput(3)">3</button>

        <button
            class="number-button"
            onclick="roomInput(4)">4</button>

        <button
            class="number-button"
            onclick="roomInput(5)">5</button>

        <button
            class="number-button"
            onclick="roomInput(6)">6</button>

        <button
            class="number-button"
            onclick="roomInput(7)">7</button>

        <button
            class="number-button"
            onclick="roomInput(8)">8</button>

        <button
            class="number-button"
            onclick="roomInput(9)">9</button>

        <button
            class="number-button"
            onclick="roomClear()">⌫</button>

        <button
            class="number-button"
            onclick="roomInput(0)">0</button>

        <button
            class="number-button"
            onclick="roomCheck()">✓</button>

    </div>


    <div
        id="roomPinMessage"
        class="pin-message">
    </div>

</section>


<!-- =====================================================
     部屋調査成功
===================================================== -->

<section
    id="roomSuccessScreen"
    class="screen">


    <button
        class="back-button"
        onclick="showScreen('roomSelectScreen')">

        ‹

    </button>


    <div class="success-sound">
        ガチャ…。
    </div>


    <div class="success-title">

        暗証番号は正しかったようだ。

    </div>


    <div
        id="roomSuccessMessage"
        class="success-message">
    </div>


    <button
        class="investigate-button"
        onclick="showScreen('roomSelectScreen')">

        部屋選択画面へ戻る

    </button>

</section>


<!-- =====================================================
     スマホ選択
===================================================== -->

<section
    id="phoneSelectScreen"
    class="screen selection-screen">


    <button
        class="back-button"
        onclick="showScreen('menuScreen')">

        ‹

    </button>


    <h2 class="page-title">
        容疑者のスマホを調べる
    </h2>


    <div class="selection-grid">


        <button
            class="selection-button"
            onclick="openPhone('みさ')">

            📱 みさのスマホ

        </button>


        <button
            class="selection-button"
            onclick="openPhone('りんたろう')">

            📱 りんたろうのスマホ

        </button>


        <button
            class="selection-button"
            onclick="openPhone('ゆうき')">

            📱 ゆうきのスマホ

        </button>


        <button
            class="selection-button"
            onclick="openPhone('わたる')">

            📱 わたるのスマホ

        </button>

    </div>

</section>


<!-- =====================================================
     スマホ
===================================================== -->

<section
    id="phoneScreen"
    class="screen">


    <div class="phone-wrapper">


        <div class="phone">


            <!-- スマホ一覧へ戻る -->

            <button
                class="phone-list-back"
                onclick="backToPhoneList()">

                ‹

            </button>


            <!-- =========================================
                 ロック画面
            ========================================== -->

            <div
                id="lockScreen"
                class="lock-screen"
                onclick="unlockSwipe()">


                <div>

                    <div
                        class="lock-time"
                        id="lockTime">

                        12:00

                    </div>


                    <div class="lock-date">

                        9月12日 金曜日

                    </div>

                </div>


                <div class="swipe-area">

                    ↑<br>

                    上にスワイプしてロック解除

                </div>

            </div>


            <!-- =========================================
                 パスコード
            ========================================== -->

            <div
                id="passcodeScreen"
                class="passcode-screen">


                <div class="passcode-title">

                    パスコードを入力

                </div>


                <div class="passcode-dots">

                    <div
                        class="pass-dot"
                        id="passDot1">
                    </div>

                    <div
                        class="pass-dot"
                        id="passDot2">
                    </div>

                    <div
                        class="pass-dot"
                        id="passDot3">
                    </div>

                    <div
                        class="pass-dot"
                        id="passDot4">
                    </div>

                </div>


                <button
                    class="forgot-button"
                    onclick="showForgotMessage()">

                    パスワードを忘れた場合

                </button>


                <div
                    id="forgotMessage"
                    class="forgot-message">
                </div>


                <div class="phone-keypad">

                    <button
                        class="phone-key"
                        onclick="phoneInput(1)">1</button>

                    <button
                        class="phone-key"
                        onclick="phoneInput(2)">2</button>

                    <button
                        class="phone-key"
                        onclick="phoneInput(3)">3</button>

                    <button
                        class="phone-key"
                        onclick="phoneInput(4)">4</button>

                    <button
                        class="phone-key"
                        onclick="phoneInput(5)">5</button>

                    <button
                        class="phone-key"
                        onclick="phoneInput(6)">6</button>

                    <button
                        class="phone-key"
                        onclick="phoneInput(7)">7</button>

                    <button
                        class="phone-key"
                        onclick="phoneInput(8)">8</button>

                    <button
                        class="phone-key"
                        onclick="phoneInput(9)">9</button>

                    <button
                        class="phone-key"
                        onclick="phoneClear()">⌫</button>

                    <button
                        class="phone-key"
                        onclick="phoneInput(0)">0</button>

                    <button
                        class="phone-key"
                        onclick="phoneCheck()">✓</button>

                </div>

            </div>


            <!-- =========================================
                 ホーム
            ========================================== -->

            <div
                id="homeScreen"
                class="home-screen">


                <div class="status-bar">

                    <span id="homeTime">
                        12:00
                    </span>

                    <span>
                        ▮▮▮ Wi-Fi 🔋
                    </span>

                </div>


                <div
                    id="appGrid"
                    class="app-grid">
                </div>

            </div>


            <!-- =========================================
                 LINE
            ========================================== -->

            <div
                id="lineApp"
                class="app-screen">


                <div class="app-header">

                    <button
                        class="app-back"
                        onclick="closeApp()">

                        ‹

                    </button>

                    LINE

                </div>


                <div
                    id="lineList"
                    class="line-list">
                </div>


                <!-- LINEチャット画像 -->

                <div
                    id="lineChat"
                    class="line-chat">


                    <div class="line-chat-header">

                        <button
                            class="app-back"
                            onclick="closeChat()">

                            ‹

                        </button>


                        <div
                            id="chatName">
                        </div>

                    </div>


                    <div
                        class="chat-image-wrapper">

                        <img
                            id="chatImage"
                            src=""
                            alt="LINEトーク">

                    </div>

                </div>

            </div>


            <!-- =========================================
                 画像アプリ共通
            ========================================== -->

            <div
                id="imageApp"

/* =====================================================

===================================================== */

let currentRoomName = "";

let currentRoomNumber = "";

let roomPin = "";

let currentPhoneName = "";

let phonePin = "";

let currentApp = "";

let currentChat = "";


/* =====================================================
   画面切り替え
===================================================== */

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });


    document
        .getElementById(id)
        .classList.add("active");

}


/* =====================================================
   部屋
===================================================== */

function openRoom(name, number) {

    currentRoomName = name;

    currentRoomNumber = number;

    roomPin = "";

    document
        .getElementById("roomNumberText")
        .textContent = number;

    updateRoomPin();

    showScreen(
        "roomPasswordScreen"
    );

}


function roomInput(number) {

    if (roomPin.length >= 4) {

        return;

    }

    roomPin += number;

    updateRoomPin();

}


function roomClear() {

    roomPin =
        roomPin.slice(0,-1);

    updateRoomPin();

}


function updateRoomPin() {

    for (
        let i = 1;
        i <= 4;
        i++
    ) {

        document
            .getElementById(
                "roomPin" + i
            )
            .classList.toggle(
                "filled",
                i <= roomPin.length
            );

    }

}


function roomCheck() {

    if (roomPin.length !== 4) {

        return;

    }


    if (
        roomPin ===
        roomPasswords[currentRoomNumber]
    ) {


        /*
         ★ 正解したら
         ★ 新しいページへ移動
        */

        document
            .getElementById(
                "roomSuccessMessage"
            )
            .innerHTML = `

                <strong>
                ${currentRoomName}の部屋を調べろ。
                </strong>

                <br><br>

                ※グループの中で
                ${currentRoomName}の部屋を
                捜査する人を2人決めてください。

                <br>

                制限時間は2分間です。

                <br>

                部屋の中のものは
                自由に撮影してOKです。

                <br>

                集めた情報は
                グループで共有してください。

            `;


        showScreen(
            "roomSuccessScreen"
        );


    } else {

        document
            .getElementById(
                "roomPinMessage"
            )
            .textContent =
            "暗証番号が違います。";

    }

}


/* =====================================================
   スマホを開く
===================================================== */

function openPhone(name) {

    currentPhoneName = name;

    phonePin = "";


    const data =
        phoneData[name];


    /*
     ロック画面画像
    */

    document
        .getElementById("lockScreen")
        .style.backgroundImage =
        `url('${data.lockImage}')`;


    /*
     ホーム画面画像
    */

    document
        .getElementById("homeScreen")
        .style.backgroundImage =
        `url('${data.homeImage}')`;


    /*
     アプリをその人用に作る
    */

    createHomeApps();


    /*
     初期状態
    */

    document
        .getElementById("lockScreen")
        .style.display = "flex";


    document
        .getElementById("passcodeScreen")
        .classList.remove("active");


    document
        .getElementById("homeScreen")
        .classList.remove("active");


    closeApp();


    document
        .getElementById("forgotMessage")
        .classList.remove("show");


    updatePhonePin();


    showScreen("phoneScreen");

}


/* =====================================================
   スマホ一覧に戻る
===================================================== */

function backToPhoneList() {

    /*
     スマホを閉じる
    */

    closeApp();


    /*
     状態をリセット
    */

    currentPhoneName = "";

    phonePin = "";


    /*
     容疑者のスマホ選択画面へ
    */

    showScreen(
        "phoneSelectScreen"
    );

}


/* =====================================================
   スワイプ
===================================================== */

function unlockSwipe() {

    document
        .getElementById("lockScreen")
        .style.display = "none";


    document
        .getElementById("passcodeScreen")
        .classList.add("active");

}


/* =====================================================
   スマホパスコード
===================================================== */

function phoneInput(number) {

    if (phonePin.length >= 4) {

        return;

    }

    phonePin += number;

    updatePhonePin();

}


function phoneClear() {

    phonePin =
        phonePin.slice(0,-1);

    updatePhonePin();

}


function updatePhonePin() {

    for (
        let i = 1;
        i <= 4;
        i++
    ) {

        document
            .getElementById(
                "passDot" + i
            )
            .classList.toggle(
                "filled",
                i <= phonePin.length
            );

    }

}


function phoneCheck() {

    if (phonePin.length !== 4) {

        return;

    }


    const data =
        phoneData[currentPhoneName];


    if (
        phonePin === data.password
    ) {

        document
            .getElementById(
                "passcodeScreen"
            )
            .classList.remove("active");


        document
            .getElementById(
                "homeScreen"
            )
            .classList.add("active");


    } else {

        phonePin = "";

        updatePhonePin();

    }

}


/* =====================================================
   パスワード忘れた場合
===================================================== */

function showForgotMessage() {

    const data =
        phoneData[currentPhoneName];


    const box =
        document
            .getElementById(
                "forgotMessage"
            );


    box.textContent =
        data.hint;


    box.classList.add("show");

}


/* =====================================================
   ホーム画面のアプリを作る
===================================================== */

function createHomeApps() {

    const grid =
        document.getElementById(
            "appGrid"
        );


    grid.innerHTML = "";


    const data =
        phoneData[currentPhoneName];


    /*
     LINE
    */

    if (data.apps.line) {

        addAppButton(
            grid,
            "line",
            "💬",
            "LINE"
        );

    }


    /*
     その他のアプリ
    */

    const apps = [
        "memo",
        "safari",
        "photo",
        "mail",
        "calendar",
        "map"
    ];


    apps.forEach(app => {

        if (data.apps[app]) {

            const icons = {

                memo: "📝",

                safari: "🌐",

                photo: "🖼️",

                mail: "✉️",

                calendar: "📅",

                map: "🗺️"

            };


            addAppButton(
                grid,
                app,
                icons[app],
                appNames[app]
            );

        }

    });

}


/* =====================================================
   アプリボタン追加
===================================================== */

function addAppButton(
    grid,
    app,
    icon,
    name
) {

    const button =
        document.createElement(
            "button"
        );


    button.className =
        "app-icon";


    button.onclick = function() {

        openApp(app);

    };


    button.innerHTML = `

        <div class="app-icon-image">
            ${icon}
        </div>

        <div class="app-name">
            ${name}
        </div>

    `;


    grid.appendChild(button);

}


/* =====================================================
   アプリを開く
===================================================== */

function openApp(app) {

    currentApp = app;


    /*
     LINE
    */

    if (app === "line") {

        openLine();

        return;

    }


    /*
     画像アプリ
    */

    const data =
        phoneData[currentPhoneName];


    const image =
        data.apps[app];


    if (!image) {

        return;

    }


    document
        .getElementById(
            "imageAppTitle"
        )
        .textContent =
        appNames[app];


    document
        .getElementById(
            "appImage"
        )
        .src = image;


    document
        .getElementById(
            "imageApp"
        )
        .classList.add("active");

}


/* =====================================================
   アプリを閉じる
===================================================== */

function closeApp() {

    document
        .querySelectorAll(
            ".app-screen"
        )
        .forEach(app => {

            app.classList.remove(
                "active"
            );

        });


    document
        .getElementById(
            "lineChat"
        )
        .classList.remove(
            "active"
        );


    currentApp = "";

}


/* =====================================================
   LINE
===================================================== */

function openLine() {

    const data =
        phoneData[currentPhoneName];


    const list =
        document
            .getElementById(
                "lineList"
            );


    list.innerHTML = "";


    data.line.forEach(person => {


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "line-person";


        button.onclick =
            function() {

                openChat(person);

            };


        button.innerHTML = `

            <div class="line-avatar">
                ${person.name.charAt(0)}
            </div>

            <div class="line-person-name">
                ${person.name}
            </div>

        `;


        list.appendChild(button);

    });


    document
        .getElementById(
            "lineApp"
        )
        .classList.add("active");

}


/* =====================================================
   LINEチャット
===================================================== */

function openChat(person) {

    currentChat =
        person.name;


    document
        .getElementById(
            "chatName"
        )
        .textContent =
        person.name;


    /*
     ★ 用意した画像を表示
    */

    document
        .getElementById(
            "chatImage"
        )
        .src =
        person.image;


    document
        .getElementById(
            "lineChat"
        )
        .classList.add("active");

}


/* =====================================================
   LINEチャットから相手一覧へ
===================================================== */

function closeChat() {

    document
        .getElementById(
            "lineChat"
        )
        .classList.remove(
            "active"
        );


    currentChat = "";

}


/* =====================================================
   時計
===================================================== */

function updateClock() {

    const now =
        new Date();


    const hours =
        String(
            now.getHours()
        ).padStart(2,"0");


    const minutes =
        String(
            now.getMinutes()
        ).padStart(2,"0");


    const time =
        hours + ":" + minutes;


    document
        .getElementById(
            "lockTime"
        )
        .textContent =
        time;


    document
        .getElementById(
            "homeTime"
        )
        .textContent =
        time;

}


setInterval(
    updateClock,
    1000
);


updateClock();
