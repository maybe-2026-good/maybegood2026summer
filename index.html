<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>りゅうせい監禁事件</title>


<style>

/* =====================================================
   基本設定
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    background: #111;

    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

    overflow-x: hidden;
}

button {
    font-family: inherit;
}


/* =====================================================
   共通画面
===================================================== */

.screen {

    width: 100%;

    min-height: 100vh;

    display: none;

}

.screen.active {

    display: flex;

}


/* =====================================================
   戻るボタン
===================================================== */

.back-button {

    position: absolute;

    top: 18px;
    left: 18px;

    z-index: 100;

    width: 45px;
    height: 45px;

    border: none;

    background: transparent;

    color: white;

    font-size: 38px;

    line-height: 45px;

    cursor: pointer;

}


/* =====================================================
   タイトル
===================================================== */

#titleScreen {

    background:
        radial-gradient(
            circle at center,
            #333 0%,
            #111 70%
        );

    align-items: center;

    justify-content: center;

    flex-direction: column;

    text-align: center;

}

.title-small {

    font-size: 14px;

    letter-spacing: 5px;

    opacity: .6;

    margin-bottom: 25px;

}

.main-title {

    font-size:
        clamp(40px, 10vw, 70px);

    line-height: 1.3;

    letter-spacing: 5px;

    margin: 0 0 60px;

}

.start-button {

    width: 240px;

    padding: 18px;

    border: 1px solid white;

    background: transparent;

    color: white;

    border-radius: 5px;

    font-size: 18px;

    cursor: pointer;

}


/* =====================================================
   メニュー
===================================================== */

#menuScreen {

    background: #181818;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 30px;

}

.page-title {

    font-size: 30px;

    margin-bottom: 45px;

    text-align: center;

}

.menu-button {

    width:
        min(500px, 90vw);

    padding: 22px;

    margin: 10px;

    background: #252525;

    color: white;

    border: 1px solid #555;

    border-radius: 10px;

    font-size: 18px;

    cursor: pointer;

}


/* =====================================================
   選択画面
===================================================== */

.selection-screen {

    position: relative;

    background: #181818;

    flex-direction: column;

    align-items: center;

    padding:
        80px 20px 40px;

}

.selection-grid {

    width:
        min(600px, 95vw);

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;

}

.selection-button {

    min-height: 120px;

    background: #292929;

    color: white;

    border: 1px solid #555;

    border-radius: 12px;

    font-size: 20px;

    cursor: pointer;

}

.selection-button span {

    display: block;

    font-size: 14px;

    opacity: .6;

    margin-bottom: 10px;

}


/* =====================================================
   スマホ画面全体
===================================================== */

#phoneScreen {

    position: relative;

    width: 100%;

    height: 100vh;

    min-height: 100vh;

    max-height: 100vh;

    background: #111;

    display: none;

    flex-direction: column;

    overflow: hidden;

}

#phoneScreen.active {

    display: flex;

}


/* =====================================================
   スマホ選択画面へ戻る
===================================================== */

.phone-navigation {

    width: 100%;

    height: 58px;

    min-height: 58px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    padding-left: 15px;

    background: #111;

    border-bottom:
        1px solid #292929;

    z-index: 1000;

}

.phone-list-back {

    height: 38px;

    padding: 0 16px;

    border: none;

    border-radius: 20px;

    background: #292929;

    color: white;

    font-size: 14px;

    cursor: pointer;

}

.phone-list-back:active {

    background: #444;

}


/* =====================================================
   スマホ本体
===================================================== */

.phone-wrapper {

    width: 100%;

    height:
        calc(100vh - 58px);

    min-height: 0;

    flex: 1;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #111;

    overflow: hidden;

}

.phone {

    width:
        min(390px, 100vw);

    height:
        min(844px, calc(100vh - 58px));

    max-height:
        calc(100vh - 58px);

    position: relative;

    overflow: hidden;

    background: #000;

    flex-shrink: 0;

}


/* =====================================================
   ロック画面
===================================================== */

.lock-screen {

    position: absolute;

    inset: 0;

    z-index: 200;

    background-color: #000;

    background-size: cover;

    background-position: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;

    padding-top: 75px;

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;

}


/* =====================================================
   時間・日付
===================================================== */

.lock-info {

    display: flex;

    flex-direction: column;

    align-items: center;

    width: 100%;

    pointer-events: none;

    flex-shrink: 0;

}

.lock-time {

    font-size: 90px;

    line-height: 1;

    font-weight: 200;

    letter-spacing: -3px;

    white-space: nowrap;

}

.lock-date {

    margin-top: 10px;

    font-size: 19px;

    line-height: 1.3;

    text-align: center;

    white-space: nowrap;

}


/* =====================================================
   スワイプ案内
===================================================== */

.swipe-area {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 120px;

    height: 100px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    font-size: 15px;

    line-height: 1.5;

    opacity: .9;

    pointer-events: none;

}

.swipe-arrow {

    font-size: 28px;

    line-height: 1;

    margin-bottom: 4px;

    animation:
        swipeArrow 1.6s infinite;

}

@keyframes swipeArrow {

    0%,
    100% {

        transform:
            translateY(5px);

    }

    50% {

        transform:
            translateY(-5px);

    }

}


/* =====================================================
   パスコード画面
===================================================== */

.passcode-screen {

    position: absolute;

    inset: 0;

    background: #111;

    z-index: 150;

    display: none;

    flex-direction: column;

    align-items: center;

    padding-top: 75px;

}

.passcode-screen.active {

    display: flex;

}

.passcode-title {

    font-size: 22px;

    margin-bottom: 20px;

}

.passcode-dots {

    display: flex;

    gap: 18px;

    margin-bottom: 25px;

}

.pass-dot {

    width: 12px;
    height: 12px;

    border: 1px solid white;

    border-radius: 50%;

}

.pass-dot.filled {

    background: white;

}

.forgot-button {

    background: transparent;

    border: none;

    color: #aaa;

    margin-bottom: 25px;

    cursor: pointer;

}

.forgot-message {

    width: 85%;

    background: #222;

    border-radius: 10px;

    padding: 15px;

    text-align: center;

    display: none;

    margin-bottom: 20px;

    font-size: 14px;

    line-height: 1.7;

}

.forgot-message.show {

    display: block;

}


/* =====================================================
   スマホ数字
===================================================== */

.phone-keypad {

    width: 280px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

}

.phone-key {

    width: 75px;
    height: 75px;

    margin: auto;

    border-radius: 50%;

    border: none;

    background: #292929;

    color: white;

    font-size: 25px;

    cursor: pointer;

}

.phone-key:active {

    background: #555;

}


/* =====================================================
   ホーム画面
===================================================== */

.home-screen {

    position: absolute;

    inset: 0;

    display: none;

    flex-direction: column;

    background-color: #333;

    background-size: cover;

    background-position: center;

    padding:
        55px 20px 30px;

    z-index: 10;

}

.home-screen.active {

    display: flex;

}

.status-bar {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    font-size: 13px;

    z-index: 10;

}

.app-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 25px 15px;

    margin-top: 20px;

}

.app-icon {

    display: flex;

    flex-direction: column;

    align-items: center;

    border: none;

    background: transparent;

    color: white;

    cursor: pointer;

}

.app-icon-image {

    width: 58px;
    height: 58px;

    border-radius: 14px;

    background: #333;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 28px;

    margin-bottom: 5px;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.4);

}

.app-name {

    font-size: 11px;

    text-shadow:
        0 1px 4px black;

}


/* =====================================================
   アプリ画面
===================================================== */

.app-screen {

    position: absolute;

    inset: 0;

    background: #f5f5f5;

    color: #111;

    display: none;

    z-index: 500;

}

.app-screen.active {

    display: block;

}

.app-header {

    height: 70px;

    background: white;

    border-bottom:
        1px solid #ddd;

    display: flex;

    align-items: center;

    padding: 0 15px;

    font-weight: bold;

    font-size: 18px;

}

.app-back {

    border: none;

    background: transparent;

    font-size: 34px;

    width: 45px;

    height: 50px;

    margin-right: 8px;

    cursor: pointer;

    color: #111;

}


/* =====================================================
   画像アプリ
===================================================== */

.image-app-content {

    width: 100%;

    height:
        calc(100% - 70px);

    overflow-y: auto;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;

    background: #111;

}

.image-app-content img {

    width: 100%;

    height: auto;

    display: block;

    object-fit: contain;

    flex-shrink: 0;

}


/* =====================================================
   LINE
===================================================== */

.line-screen {

    background: white;

}

.line-list {

    padding: 10px 0;

}

.line-person {

    width: 100%;

    border: none;

    background: white;

    border-bottom:
        1px solid #ddd;

    padding: 15px;

    display: flex;

    align-items: center;

    cursor: pointer;

    text-align: left;

}

.line-avatar {

    width: 50px;
    height: 50px;

    border-radius: 50%;

    background: #ccc;

    margin-right: 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #555;

    font-size: 20px;

}

.line-person-name {

    font-size: 16px;

}


/* =====================================================
   LINEチャット
===================================================== */

.line-chat {

    display: none;

    position: absolute;

    inset: 0;

    background: #e8e8e8;

    z-index: 600;

}

.line-chat.active {

    display: block;

}

.line-chat-header {

    height: 70px;

    background: white;

    border-bottom:
        1px solid #ccc;

    display: flex;

    align-items: center;

    padding: 0 15px;

}

.chat-image-wrapper {

    height:
        calc(100% - 70px);

    overflow-y: auto;

    background: #111;

    display: flex;

    justify-content: center;

    align-items: flex-start;

}

.chat-image-wrapper img {

    width: 100%;

    height: auto;

    display: block;

}


/* =====================================================
   スマホ対応
===================================================== */

@media (max-width: 700px) {

    .phone-wrapper {

        align-items: flex-start;

    }

    .phone {

        width: 100vw;

        height: calc(100vh - 58px);

        max-height: calc(100vh - 58px);

    }

    .selection-grid {

        grid-template-columns: 1fr;

    }

    .selection-button {

        min-height: 90px;

    }

}


/* =====================================================
   ここでCSS終了
===================================================== */

</style>

</head>

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });


    const target =
        document.getElementById(id);


    if (target) {

        target.classList.add("active");

    }

}


/* =====================================================
   スマホを開く
===================================================== */

function openPhone(name) {

    currentPhoneName = name;

    phonePin = "";

    currentApp = "";


    const data =
        phoneData[name];


    if (!data) {
        return;
    }


    document
        .getElementById("lockScreen")
        .style.backgroundImage =
        `url("${data.lockImage}")`;


    document
        .getElementById("homeScreen")
        .style.backgroundImage =
        `url("${data.homeImage}")`;


    createHomeApps();


    document
        .getElementById("lockScreen")
        .style.display = "flex";


    document
        .getElementById("passcodeScreen")
        .classList.remove("active");


    document
        .getElementById("homeScreen")
        .classList.remove("active");


    closeApp();


    document
        .getElementById("forgotMessage")
        .classList.remove("show");


    updatePhonePin();


    showScreen("phoneScreen");

}


/* =====================================================
   スマホ選択画面へ戻る
===================================================== */

function backToPhoneList() {

    closeApp();

    currentPhoneName = "";

    phonePin = "";

    showScreen(
        "phoneSelectScreen"
    );

}


/* =====================================================
   ロック画面スワイプ
===================================================== */

let swipeStartY = 0;
let swipeStartX = 0;
let isSwiping = false;


const lockScreen =
    document.getElementById(
        "lockScreen"
    );


lockScreen.addEventListener(
    "touchstart",
    function(event) {

        if (
            event.touches.length !== 1
        ) {
            return;
        }

        swipeStartY =
            event.touches[0].clientY;

        swipeStartX =
            event.touches[0].clientX;

        isSwiping = true;

    },
    {
        passive: false
    }
);


lockScreen.addEventListener(
    "touchmove",
    function(event) {

        if (!isSwiping) {
            return;
        }

        event.preventDefault();

    },
    {
        passive: false
    }
);


lockScreen.addEventListener(
    "touchend",
    function(event) {

        if (!isSwiping) {
            return;
        }

        isSwiping = false;


        if (
            event.changedTouches.length !== 1
        ) {
            return;
        }


        const endY =
            event.changedTouches[0].clientY;

        const endX =
            event.changedTouches[0].clientX;


        const diffY =
            endY - swipeStartY;

        const diffX =
            endX - swipeStartX;


        if (
            diffY < -100 &&
            Math.abs(diffY) >
            Math.abs(diffX)
        ) {

            unlockPhone();

        }

    },
    {
        passive: false
    }
);


/* =====================================================
   Pointer Event
===================================================== */

let pointerStartY = null;
let pointerStartX = null;


lockScreen.addEventListener(
    "pointerdown",
    function(event) {

        pointerStartY =
            event.clientY;

        pointerStartX =
            event.clientX;

    }
);


lockScreen.addEventListener(
    "pointerup",
    function(event) {

        if (
            pointerStartY === null
        ) {
            return;
        }


        const diffY =
            event.clientY -
            pointerStartY;

        const diffX =
            event.clientX -
            pointerStartX;


        if (
            diffY < -100 &&
            Math.abs(diffY) >
            Math.abs(diffX)
        ) {

            unlockPhone();

        }


        pointerStartY = null;
        pointerStartX = null;

    }
);


/* =====================================================
   ロック解除
===================================================== */

function unlockPhone() {

    if (
        document
            .getElementById("lockScreen")
            .style.display === "none"
    ) {

        return;

    }


    document
        .getElementById("lockScreen")
        .style.display = "none";


    document
        .getElementById("passcodeScreen")
        .classList.add("active");

}


/* =====================================================
   スマホパスコード
===================================================== */

function phoneInput(number) {

    if (phonePin.length >= 4) {
        return;
    }

    phonePin += number;

    updatePhonePin();

}


function phoneClear() {

    phonePin =
        phonePin.slice(0, -1);

    updatePhonePin();

}


function updatePhonePin() {

    for (
        let i = 1;
        i <= 4;
        i++
    ) {

        document
            .getElementById(
                "passDot" + i
            )
            .classList.toggle(
                "filled",
                i <= phonePin.length
            );

    }

}


function phoneCheck() {

    if (phonePin.length !== 4) {
        return;
    }


    const data =
        phoneData[currentPhoneName];


    if (
        phonePin === data.password
    ) {

        document
            .getElementById(
                "passcodeScreen"
            )
            .classList.remove("active");


        document
            .getElementById(
                "homeScreen"
            )
            .classList.add("active");


    } else {

        phonePin = "";

        updatePhonePin();

    }

}


/* =====================================================
   パスワードを忘れた場合
===================================================== */

function showForgotMessage() {

    const data =
        phoneData[currentPhoneName];


    const box =
        document.getElementById(
            "forgotMessage"
        );


    box.textContent =
        data.hint;


    box.classList.add("show");

}


/* =====================================================
   ホーム画面のアプリ
===================================================== */

function createHomeApps() {

    const grid =
        document.getElementById(
            "appGrid"
        );


    grid.innerHTML = "";


    const data =
        phoneData[currentPhoneName];


    if (data.apps.line) {

        addAppButton(
            grid,
            "line",
            "💬",
            "LINE"
        );

    }


    const apps = [

        "memo",
        "safari",
        "photo",
        "mail",
        "calendar",
        "map"

    ];


    apps.forEach(app => {

        if (data.apps[app]) {

            const icons = {

                memo: "📝",
                safari: "🌐",
                photo: "🖼️",
                mail: "✉️",
                calendar: "📅",
                map: "🗺️"

            };


            addAppButton(
                grid,
                app,
                icons[app],
                appNames[app]
            );

        }

    });

}


/* =====================================================
   アプリボタン
===================================================== */

function addAppButton(
    grid,
    app,
    icon,
    name
) {

    const button =
        document.createElement(
            "button"
        );


    button.className =
        "app-icon";


    button.type =
        "button";


    button.onclick =
        function() {

            openApp(app);

        };


    button.innerHTML = `

        <div class="app-icon-image">
            ${icon}
        </div>

        <div class="app-name">
            ${name}
        </div>

    `;


    grid.appendChild(button);

}


/* =====================================================
   アプリを開く
===================================================== */

function openApp(app) {

    currentApp = app;


    if (app === "line") {

        openLine();

        return;

    }


    const data =
        phoneData[currentPhoneName];


    const image =
        data.apps[app];


    if (!image) {
        return;
    }


    document
        .getElementById(
            "imageAppTitle"
        )
        .textContent =
        appNames[app];


    const content =
        document.getElementById(
            "imageAppContent"
        );


    content.innerHTML = "";


    /*
       画像が複数枚の場合は
       配列として設定された画像を
       上から順番に縦に表示する
    */

    const images =
        Array.isArray(image)
            ? image
            : [image];


    images.forEach(imagePath => {

        const img =
            document.createElement("img");


        img.src =
            imagePath;


        img.alt =
            "アプリ内容";


        content.appendChild(img);

    });


    document
        .getElementById(
            "imageApp"
        )
        .classList.add("active");

}


/* =====================================================
   アプリを閉じる
===================================================== */

function closeApp() {

    document
        .querySelectorAll(
            ".app-screen"
        )
        .forEach(app => {

            app.classList.remove(
                "active"
            );

        });


    document
        .getElementById(
            "lineChat"
        )
        .classList.remove(
            "active"
        );


    currentApp = "";

}


/* =====================================================
   LINE
===================================================== */

function openLine() {

    const data =
        phoneData[currentPhoneName];


    const list =
        document.getElementById(
            "lineList"
        );


    list.innerHTML = "";


    data.line.forEach(person => {

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "line-person";


        button.type =
            "button";


        button.onclick =
            function() {

                openChat(person);

            };


        button.innerHTML = `

            <div class="line-avatar">

                ${person.name.charAt(0)}

            </div>

            <div class="line-person-name">

                ${person.name}

            </div>

        `;


        list.appendChild(button);

    });


    document
        .getElementById(
            "lineApp"
        )
        .classList.add("active");

}


/* =====================================================
   LINEチャット
===================================================== */

function openChat(person) {

    document
        .getElementById(
            "chatName"
        )
        .textContent =
        person.name;


    document
        .getElementById(
            "chatImage"
        )
        .src =
        person.image;


    document
        .getElementById(
            "lineChat"
        )
        .classList.add("active");

}


/* =====================================================
   LINEチャット → 相手一覧
===================================================== */

function closeChat() {

    document
        .getElementById(
            "lineChat"
        )
        .classList.remove(
            "active"
        );

}


/* =====================================================
   時計
===================================================== */

function updateClock() {

    const now =
        new Date();


    const hours =
        String(
            now.getHours()
        ).padStart(2, "0");


    const minutes =
        String(
            now.getMinutes()
        ).padStart(2, "0");


    const time =
        hours + ":" + minutes;


    document
        .getElementById(
            "lockTime"
        )
        .textContent =
        time;


    document
        .getElementById(
            "homeTime"
        )
        .textContent =
        time;


    const month =
        now.getMonth() + 1;


    const date =
        now.getDate();


    const weekdays = [

        "日曜日",
        "月曜日",
        "火曜日",
        "水曜日",
        "木曜日",
        "金曜日",
        "土曜日"

    ];


    const weekday =
        weekdays[
            now.getDay()
        ];


    document
        .getElementById(
            "lockDate"
        )
        .textContent =
        `${month}月${date}日 ${weekday}`;

}


setInterval(
    updateClock,
    1000
);


updateClock();

</script>
