<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>りゅうせい監禁事件</title>


<style>

/* =====================================================
   基本設定
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    background: #111;

    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

    overflow-x: hidden;
}

button {
    font-family: inherit;
}


/* =====================================================
   共通画面
===================================================== */

.screen {

    width: 100%;

    min-height: 100vh;

    display: none;

}

.screen.active {

    display: flex;

}


/* =====================================================
   戻るボタン
===================================================== */

.back-button {

    position: absolute;

    top: 18px;
    left: 18px;

    z-index: 100;

    width: 45px;
    height: 45px;

    border: none;

    background: transparent;

    color: white;

    font-size: 38px;

    line-height: 45px;

    cursor: pointer;

}


/* =====================================================
   タイトル
===================================================== */

#titleScreen {

    background:
        radial-gradient(
            circle at center,
            #333 0%,
            #111 70%
        );

    align-items: center;

    justify-content: center;

    flex-direction: column;

    text-align: center;

}

.title-small {

    font-size: 14px;

    letter-spacing: 5px;

    opacity: .6;

    margin-bottom: 25px;

}

.main-title {

    font-size:
        clamp(40px, 10vw, 70px);

    line-height: 1.3;

    letter-spacing: 5px;

    margin: 0 0 60px;

}

.start-button {

    width: 240px;

    padding: 18px;

    border: 1px solid white;

    background: transparent;

    color: white;

    border-radius: 5px;

    font-size: 18px;

    cursor: pointer;

}


/* =====================================================
   メニュー
===================================================== */

#menuScreen {

    background: #181818;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 30px;

}

.page-title {

    font-size: 30px;

    margin-bottom: 45px;

    text-align: center;

}

.menu-button {

    width:
        min(500px, 90vw);

    padding: 22px;

    margin: 10px;

    background: #252525;

    color: white;

    border: 1px solid #555;

    border-radius: 10px;

    font-size: 18px;

    cursor: pointer;

}


/* =====================================================
   選択画面
===================================================== */

.selection-screen {

    position: relative;

    background: #181818;

    flex-direction: column;

    align-items: center;

    padding:
        80px 20px 40px;

}

.selection-grid {

    width:
        min(600px, 95vw);

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;

}

.selection-button {

    min-height: 120px;

    background: #292929;

    color: white;

    border: 1px solid #555;

    border-radius: 12px;

    font-size: 20px;

    cursor: pointer;

}

.selection-button span {

    display: block;

    font-size: 14px;

    opacity: .6;

    margin-bottom: 10px;

}


/* =====================================================
   部屋パスワード
===================================================== */

.password-screen {

    position: relative;

    background: #181818;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}

.password-title {

    font-size: 18px;

    margin-bottom: 20px;

    text-align: center;

}

.pin-display {

    display: flex;

    gap: 18px;

    margin-bottom: 35px;

}

.pin-dot {

    width: 15px;
    height: 15px;

    border: 2px solid white;

    border-radius: 50%;

}

.pin-dot.filled {

    background: white;

}


/* =====================================================
   部屋数字ボタン
===================================================== */

.number-pad {

    width: 280px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

}

.number-button {

    width: 75px;
    height: 75px;

    margin: auto;

    border: none;

    border-radius: 50%;

    background: #333;

    color: white;

    font-size: 25px;

    cursor: pointer;

}

.number-button:active {

    background: #666;

}

.pin-message {

    margin-top: 25px;

    text-align: center;

    line-height: 1.8;

}


/* =====================================================
   部屋成功画面
===================================================== */

#roomSuccessScreen {

    position: relative;

    background:
        radial-gradient(
            circle,
            #333,
            #111
        );

    align-items: center;

    justify-content: center;

    flex-direction: column;

    padding: 30px;

    text-align: center;

}

.success-sound {

    font-size: 25px;

    margin-bottom: 25px;

}

.success-title {

    font-size: 28px;

    margin-bottom: 30px;

}

.success-message {

    max-width: 600px;

    line-height: 2;

    font-size: 16px;

}

.investigate-button {

    margin-top: 35px;

    padding: 15px 35px;

    background: white;

    color: black;

    border: none;

    border-radius: 8px;

    font-size: 16px;

}


/* =====================================================
   ★ スマホ画面全体
===================================================== */

#phoneScreen {

    position: relative;

    width: 100%;

    min-height: 100vh;

    background: #111;

    display: none;

    flex-direction: column;

}

#phoneScreen.active {

    display: flex;

}


/* =====================================================
   ★ スマホ選択画面へ戻る専用バー
=====================================================

   ここをスマホ本体の外に置くことで、
   アプリ内の戻るボタンと重ならない。
===================================================== */

.phone-navigation {

    width: 100%;

    height: 58px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    padding-left: 15px;

    background: #111;

    border-bottom:
        1px solid #292929;

    z-index: 1000;

}

.phone-list-back {

    height: 38px;

    padding: 0 16px;

    border: none;

    border-radius: 20px;

    background: #292929;

    color: white;

    font-size: 14px;

    cursor: pointer;

}

.phone-list-back:active {

    background: #444;

}


/* =====================================================
   スマホ本体
===================================================== */

.phone-wrapper {

    width: 100%;

    flex: 1;

    min-height: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #111;

}

.phone {

    width:
        min(390px, 100vw);

    height:
        min(844px, calc(100vh - 58px));

    position: relative;

    overflow: hidden;

    background: #000;

}


/* =====================================================
   ★ ロック画面
===================================================== */

.lock-screen {

    position: absolute;

    inset: 0;

    z-index: 20;

    background-color: #000;

    background-size: cover;

    background-position: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;

    padding-top: 75px;

    /*
       ★ タップでは解除しない
       ★ スワイプ判定のみJavaScriptで行う
    */

    touch-action: none;

    user-select: none;

}


/* =====================================================
   ★ 時間・日付
===================================================== */

.lock-info {

    display: flex;

    flex-direction: column;

    align-items: center;

    width: 100%;

    pointer-events: none;

}


.lock-time {

    font-size: 70px;

    line-height: 1;

    font-weight: 200;

    letter-spacing: -3px;

}


.lock-date {

    margin-top: 18px;

    font-size: 18px;

    line-height: 1.2;

    text-align: center;

}


/* =====================================================
   ★ スワイプ案内
===================================================== */

.swipe-area {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 75px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    font-size: 15px;

    line-height: 1.7;

    opacity: .9;

    pointer-events: none;

}

.swipe-arrow {

    font-size: 28px;

    line-height: 1;

    margin-bottom: 4px;

    animation:
        swipeArrow 1.6s infinite;

}

@keyframes swipeArrow {

    0%,
    100% {

        transform:
            translateY(5px);

    }

    50% {

        transform:
            translateY(-5px);

    }

}


/* =====================================================
   ★ パスコード画面
===================================================== */

.passcode-screen {

    position: absolute;

    inset: 0;

    background: #111;

    z-index: 15;

    display: none;

    flex-direction: column;

    align-items: center;

    padding-top: 85px;

}

.passcode-screen.active {

    display: flex;

}

.passcode-title {

    font-size: 22px;

    margin-bottom: 20px;

}

.passcode-dots {

    display: flex;

    gap: 18px;

    margin-bottom: 25px;

}

.pass-dot {

    width: 12px;
    height: 12px;

    border: 1px solid white;

    border-radius: 50%;

}

.pass-dot.filled {

    background: white;

}

.forgot-button {

    background: transparent;

    border: none;

    color: #aaa;

    margin-bottom: 25px;

    cursor: pointer;

}

.forgot-message {

    width: 85%;

    background: #222;

    border-radius: 10px;

    padding: 15px;

    text-align: center;

    display: none;

    margin-bottom: 20px;

    font-size: 14px;

    line-height: 1.7;

}

.forgot-message.show {

    display: block;

}


/* =====================================================
   スマホ数字
===================================================== */

.phone-keypad {

    width: 280px;

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 12px;

}

.phone-key {

    width: 75px;
    height: 75px;

    margin: auto;

    border-radius: 50%;

    border: none;

    background: #292929;

    color: white;

    font-size: 25px;

    cursor: pointer;

}

.phone-key:active {

    background: #555;

}


/* =====================================================
   ホーム画面
===================================================== */

.home-screen {

    position: absolute;

    inset: 0;

    display: none;

    flex-direction: column;

    background-color: #333;

    background-size: cover;

    background-position: center;

    padding:
        55px 20px 30px;

}

.home-screen.active {

    display: flex;

}

.status-bar {

    position: absolute;

    top: 15px;

    left: 20px;

    right: 20px;

    display: flex;

    justify-content: space-between;

    font-size: 13px;

    z-index: 10;

}

.app-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 25px 15px;

    margin-top: 20px;

}

.app-icon {

    display: flex;

    flex-direction: column;

    align-items: center;

    border: none;

    background: transparent;

    color: white;

    cursor: pointer;

}

.app-icon-image {

    width: 58px;
    height: 58px;

    border-radius: 14px;

    background: #333;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 28px;

    margin-bottom: 5px;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.4);

}

.app-name {

    font-size: 11px;

    text-shadow:
        0 1px 4px black;

}


/* =====================================================
   アプリ画面
===================================================== */

.app-screen {

    position: absolute;

    inset: 0;

    background: #f5f5f5;

    color: #111;

    display: none;

    z-index: 50;

}

.app-screen.active {

    display: block;

}

.app-header {

    height: 70px;

    background: white;

    border-bottom:
        1px solid #ddd;

    display: flex;

    align-items: center;

    padding: 0 15px;

    font-weight: bold;

    font-size: 18px;

}

.app-back {

    border: none;

    background: transparent;

    font-size: 34px;

    width: 45px;

    height: 50px;

    margin-right: 8px;

    cursor: pointer;

    color: #111;

}


/* =====================================================
   画像アプリ
===================================================== */

.image-app-content {

    width: 100%;

    height:
        calc(100% - 70px);

    overflow-y: auto;

    display: flex;

    align-items: flex-start;

    justify-content: center;

    background: #111;

}

.image-app-content img {

    width: 100%;

    height: auto;

    display: block;

    object-fit: contain;

}


/* =====================================================
   LINE
===================================================== */

.line-screen {

    background: white;

}

.line-list {

    padding: 10px 0;

}

.line-person {

    width: 100%;

    border: none;

    background: white;

    border-bottom:
        1px solid #ddd;

    padding: 15px;

    display: flex;

    align-items: center;

    cursor: pointer;

    text-align: left;

}

.line-avatar {

    width: 50px;
    height: 50px;

    border-radius: 50%;

    background: #ccc;

    margin-right: 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #555;

    font-size: 20px;

}

.line-person-name {

    font-size: 16px;

}


/* =====================================================
   LINEチャット
===================================================== */

.line-chat {

    display: none;

    position: absolute;

    inset: 0;

    background: #e8e8e8;

    z-index: 100;

}

.line-chat.active {

    display: block;

}

.line-chat-header {

    height: 70px;

    background: white;

    border-bottom:
        1px solid #ccc;

    display: flex;

    align-items: center;

    padding: 0 15px;

}

.chat-image-wrapper {

    height:
        calc(100% - 70px);

    overflow-y: auto;

    background: #111;

    display: flex;

    justify-content: center;

    align-items: flex-start;

}

.chat-image-wrapper img {

    width: 100%;

    height: auto;

    display: block;

}


/* =====================================================
   PC・スマホ調整
===================================================== */

@media (max-width: 500px) {

    .phone-wrapper {

        align-items: flex-start;

    }

    .phone {

        width: 100vw;

        height: 100%;

    }

    .selection-grid {

        grid-template-columns:
            1fr;

    }

    .selection-button {

        min-height: 90px;

    }

}


/* =====================================================
   高さが小さい端末
===================================================== */

@media (max-height: 700px) {

    .lock-screen {

        padding-top: 45px;

    }

    .lock-time {

        font-size: 58px;

    }

    .lock-date {

        margin-top: 10px;

    }

    .swipe-area {

        bottom: 35px;

    }

    .app-grid {

        gap: 15px 10px;

    }

}

</style>

</head>


<body>


<div id="app">


<!-- =====================================================
     タイトル画面
===================================================== -->

<section
    id="titleScreen"
    class="screen active">


    <div class="title-small">
        MAYBEGOOD MYSTERY
    </div>


    <h1 class="main-title">

        りゅうせい<br>
        監禁事件

    </h1>


    <button
        class="start-button"
        onclick="showScreen('menuScreen')">

        START

    </button>

</section>



<!-- =====================================================
     メニュー
===================================================== -->

<section
    id="menuScreen"
    class="screen">


    <button
        class="back-button"
        onclick="showScreen('titleScreen')">

        ‹

    </button>


    <h2 class="page-title">
        捜査メニュー
    </h2>


    <button
        class="menu-button"
        onclick="showScreen('roomSelectScreen')">

        🏨 容疑者の部屋を調べる

    </button>


    <button
        class="menu-button"
        onclick="showScreen('phoneSelectScreen')">

        📱 容疑者のスマホを調べる

    </button>

</section>



<!-- =====================================================
     部屋選択
===================================================== -->

<section
    id="roomSelectScreen"
    class="screen selection-screen">


    <button
        class="back-button"
        onclick="showScreen('menuScreen')">

        ‹

    </button>


    <h2 class="page-title">
        容疑者の部屋を調べる
    </h2>


    <div class="selection-grid">


        <button
            class="selection-button"
            onclick="openRoom('みさ','101')">

            <span>101号室</span>

            みさの部屋

        </button>


        <button
            class="selection-button"
            onclick="openRoom('りんたろう','102')">

            <span>102号室</span>

            りんたろうの部屋

        </button>


        <button
            class="selection-button"
            onclick="openRoom('ゆうき','202')">

            <span>202号室</span>

            ゆうきの部屋

        </button>


        <button
            class="selection-button"
            onclick="openRoom('わたる','203')">

            <span>203号室</span>

            わたるの部屋

        </button>

    </div>

</section>



<!-- =====================================================
     部屋パスワード
===================================================== -->

<section
    id="roomPasswordScreen"
    class="screen password-screen">


    <button
        class="back-button"
        onclick="showScreen('roomSelectScreen')">

        ‹

    </button>


    <div class="password-title">

        <span id="roomNumberText"></span>号室

    </div>


    <div class="password-title">

        暗証番号を入力してください

    </div>


    <div class="pin-display">

        <div
            class="pin-dot"
            id="roomPin1">
        </div>

        <div
            class="pin-dot"
            id="roomPin2">
        </div>

        <div
            class="pin-dot"
            id="roomPin3">
        </div>

        <div
            class="pin-dot"
            id="roomPin4">
        </div>

    </div>


    <div class="number-pad">

        <button
            class="number-button"
            onclick="roomInput(1)">1</button>

        <button
            class="number-button"
            onclick="roomInput(2)">2</button>

        <button
            class="number-button"
            onclick="roomInput(3)">3</button>

        <button
            class="number-button"
            onclick="roomInput(4)">4</button>

        <button
            class="number-button"
            onclick="roomInput(5)">5</button>

        <button
            class="number-button"
            onclick="roomInput(6)">6</button>

        <button
            class="number-button"
            onclick="roomInput(7)">7</button>

        <button
            class="number-button"
            onclick="roomInput(8)">8</button>

        <button
            class="number-button"
            onclick="roomInput(9)">9</button>

        <button
            class="number-button"
            onclick="roomClear()">⌫</button>

        <button
            class="number-button"
            onclick="roomInput(0)">0</button>

        <button
            class="number-button"
            onclick="roomCheck()">✓</button>

    </div>


    <div
        id="roomPinMessage"
        class="pin-message">
    </div>

</section>



<!-- =====================================================
     部屋成功画面
===================================================== -->

<section
    id="roomSuccessScreen"
    class="screen">


    <button
        class="back-button"
        onclick="showScreen('roomSelectScreen')">

        ‹

    </button>


    <div class="success-sound">
        ガチャ…。
    </div>


    <div class="success-title">

        暗証番号は正しかったようだ。

    </div>


    <div
        id="roomSuccessMessage"
        class="success-message">
    </div>


    <button
        class="investigate-button"
        onclick="showScreen('roomSelectScreen')">

        部屋選択画面へ戻る

    </button>

</section>



<!-- =====================================================
     スマホ選択
===================================================== -->

<section
    id="phoneSelectScreen"
    class="screen selection-screen">


    <button
        class="back-button"
        onclick="showScreen('menuScreen')">

        ‹

    </button>


    <h2 class="page-title">

        容疑者のスマホを調べる

    </h2>


    <div class="selection-grid">


        <button
            class="selection-button"
            onclick="openPhone('みさ')">

            📱 みさのスマホ

        </button>


        <button
            class="selection-button"
            onclick="openPhone('りんたろう')">

            📱 りんたろうのスマホ

        </button>


        <button
            class="selection-button"
            onclick="openPhone('ゆうき')">

            📱 ゆうきのスマホ

        </button>


        <button
            class="selection-button"
            onclick="openPhone('わたる')">

            📱 わたるのスマホ

        </button>

    </div>

</section>



<!-- =====================================================
     ★ スマホ本体
===================================================== -->

<section
    id="phoneScreen"
    class="screen">


    <!-- ================================================
         ★ スマホ選択画面へ戻る
         ★ スマホ本体の外側
    ================================================= -->

    <div class="phone-navigation">

        <button
            class="phone-list-back"
            onclick="backToPhoneList()">

            ‹ スマホ選択へ戻る

        </button>

    </div>


    <!-- ================================================
         スマホ本体
    ================================================= -->

    <div class="phone-wrapper">


        <div class="phone">


            <!-- ========================================
                 ★ ロック画面
            ========================================= -->


            <div
                id="lockScreen"
                class="lock-screen">


                <!-- 時間と日付 -->

                <div class="lock-info">


                    <div
                        class="lock-time"
                        id="lockTime">

                        00:00

                    </div>


                    <div
                        class="lock-date"
                        id="lockDate">

                        9月12日 金曜日

                    </div>


                </div>


                <!-- スワイプ案内 -->

                <div class="swipe-area">


                    <div class="swipe-arrow">

                        ↑

                    </div>


                    <div>

                        上にスワイプして<br>
                        ロック解除

                    </div>


                </div>


            </div>



            <!-- ========================================
                 パスコード画面
            ========================================= -->

            <div
                id="passcodeScreen"
                class="passcode-screen">


                <div class="passcode-title">

                    パスコードを入力

                </div>


                <div class="passcode-dots">

                    <div
                        class="pass-dot"
                        id="passDot1">
                    </div>

                    <div
                        class="pass-dot"
                        id="passDot2">
                    </div>

                    <div
                        class="pass-dot"
                        id="passDot3">
                    </div>

                    <div
                        class="pass-dot"
                        id="passDot4">
                    </div>

                </div>


                <button
                    class="forgot-button"
                    onclick="showForgotMessage()">

                    パスワードを忘れた場合

                </button>


                <div
                    id="forgotMessage"
                    class="forgot-message">
                </div>


                <div class="phone-keypad">


                    <button

/* =====================================================
   ★★★ ロック画面のスワイプ処理 ★★★
===================================================== */

let swipeStartY = 0;

let swipeStartX = 0;


const lockScreen =
    document.getElementById(
        "lockScreen"
    );


/*
   指を触れた位置を記録
*/

lockScreen.addEventListener(
    "touchstart",
    function(event) {

        if (
            event.touches.length !== 1
        ) {

            return;

        }

        swipeStartY =
            event.touches[0].clientY;

        swipeStartX =
            event.touches[0].clientX;

    },
    { passive: true }
);


/*
   指を離したときに判定
*/

lockScreen.addEventListener(
    "touchend",
    function(event) {

        if (
            event.changedTouches.length !== 1
        ) {

            return;

        }


        const endY =
            event.changedTouches[0].clientY;

        const endX =
            event.changedTouches[0].clientX;


        const diffY =
            endY - swipeStartY;

        const diffX =
            endX - swipeStartX;


        /*
           上方向へ100px以上
           かつ横移動より縦移動が大きい
        */

        if (
            diffY < -100 &&
            Math.abs(diffY) >
            Math.abs(diffX)
        ) {

            unlockPhone();

        }

    },
    { passive: true }
);



/*
   PCでのテスト用
   マウスでも上にドラッグできる
*/

let mouseStartY = null;


lockScreen.addEventListener(
    "mousedown",
    function(event) {

        mouseStartY =
            event.clientY;

    }
);


lockScreen.addEventListener(
    "mouseup",
    function(event) {

        if (mouseStartY === null) {

            return;

        }


        const diff =
            event.clientY -
            mouseStartY;


        if (diff < -100) {

            unlockPhone();

        }


        mouseStartY = null;

    }
);

function updateClock() {

    const now =
        new Date();


    const hours =
        String(
            now.getHours()
        ).padStart(2, "0");


    const minutes =
        String(
            now.getMinutes()
        ).padStart(2, "0");


    const time =
        hours + ":" + minutes;


    document
        .getElementById(
            "lockTime"
        )
        .textContent =
        time;


    document
        .getElementById(
            "homeTime"
        )
        .textContent =
        time;

       日付も自動更新
    */

    const month =
        now.getMonth() + 1;


    const date =
        now.getDate();


    const weekdays = [

        "日曜日",
        "月曜日",
        "火曜日",
        "水曜日",
        "木曜日",
        "金曜日",
        "土曜日"

    ];


    const weekday =
        weekdays[
            now.getDay()
        ];


    document
        .getElementById(
            "lockDate"
        )
        .textContent =
        `${month}月${date}日 ${weekday}`;

}
