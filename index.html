<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>りゅうせい監禁事件</title>

<style>

/* =========================================================
   全体
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background: #111;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
}

button {
    font-family: inherit;
}


/* =========================================================
   通常ページ
========================================================= */

.page {
    display: none;

    width: 100%;
    min-height: 100vh;

    padding: 40px 20px;
}

.page.active {
    display: block;
}

.page h1 {
    text-align: center;
    margin: 30px 0 50px;
    font-size: 28px;
}

.page h2 {
    text-align: center;
    margin: 20px 0 40px;
}


/* =========================================================
   タイトル
========================================================= */

#titlePage {
    display: flex;

    min-height: 100vh;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;
}

#titlePage h1 {
    margin: 0 0 50px;

    font-size: 34px;
    line-height: 1.5;
}

.start-button {
    width: 280px;

    padding: 18px;

    border: none;
    border-radius: 12px;

    background: #333;
    color: white;

    font-size: 18px;
}


/* =========================================================
   メニューボタン
========================================================= */

.menu-button,
.room-button,
.phone-select-button {

    display: block;

    width: min(500px, 90%);

    margin: 15px auto;

    padding: 18px 20px;

    border: 1px solid #555;
    border-radius: 12px;

    background: #222;

    color: white;

    font-size: 18px;

    text-align: center;

    cursor: pointer;
}

.menu-button:active,
.room-button:active,
.phone-select-button:active {
    background: #444;
}


/* =========================================================
   戻るボタン
========================================================= */

.normal-back {

    display: block;

    margin: 20px auto;

    padding: 12px 24px;

    border: none;

    border-radius: 25px;

    background: #333;

    color: white;

    font-size: 15px;
}


/* =========================================================
   部屋パスワード
========================================================= */

.room-password-page {
    text-align: center;
}

.room-name {
    font-size: 25px;
    margin-bottom: 35px;
}

.password-dots {
    display: flex;

    justify-content: center;
    gap: 18px;

    margin: 30px 0;
}

.password-dot {
    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: transparent;

    border: 2px solid white;
}

.password-dot.filled {
    background: white;
}


/* =========================================================
   数字ボタン
   スマホロックと同じ円形
========================================================= */

.number-pad {

    width: 300px;

    margin: 20px auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;
}

.number-button {

    width: 78px;
    height: 78px;

    margin: auto;

    border: none;

    border-radius: 50%;

    background: #333;

    color: white;

    font-size: 27px;

    cursor: pointer;
}

.number-button:active {
    background: #555;
}

.number-button.clear {
    font-size: 15px;
}

.password-message {

    min-height: 70px;

    margin: 20px auto;

    max-width: 600px;

    line-height: 1.8;

    font-size: 16px;
}


/* =========================================================
   部屋正解ページ
========================================================= */

.room-success {

    text-align: center;

    padding-top: 80px;
}

.room-success h2 {

    font-size: 27px;

    line-height: 1.7;
}

.room-success p {

    max-width: 600px;

    margin: 30px auto;

    line-height: 2;

    font-size: 16px;
}


/* =========================================================
   =========================================================
   スマホ選択画面
   =========================================================
========================================================= */

#phoneSelectPage {
    text-align: center;
}

.phone-select-button {
    padding: 20px;
}


/* =========================================================
   スマホ画面全体
========================================================= */

#phoneScreen {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #111;

    display: none;

    flex-direction: column;

    overflow: hidden;

    z-index: 5000;
}

#phoneScreen.active {
    display: flex;
}


/* =========================================================
   スマホ選択画面へ戻るバー
   ★スマホ本体の外側
========================================================= */

.phone-navigation {

    width: 100%;

    height: 70px;
    min-height: 70px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    padding: 10px 15px;

    background: #111;

    border-bottom: 1px solid #333;

    z-index: 10000;
}

.phone-list-back {

    height: 45px;

    padding: 0 18px;

    border: none;

    border-radius: 24px;

    background: #292929;

    color: white;

    font-size: 15px;

    cursor: pointer;
}


/* =========================================================
   スマホ本体を表示する領域
========================================================= */

.phone-wrapper {

    position: relative;

    width: 100%;

    height: calc(100% - 70px);

    min-height: 0;

    flex: 1 1 auto;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #111;

    overflow: hidden;
}


/* =========================================================
   スマホ本体
========================================================= */

.phone {

    position: relative;

    width: min(390px, 100%);

    height: 100%;

    min-height: 0;

    background: #000;

    overflow: hidden;

    flex-shrink: 0;
}


/* =========================================================
   ロック画面
========================================================= */

.lock-screen {

    position: absolute;

    inset: 0;

    z-index: 100;

    background-color: #000;

    background-size: cover;

    background-position: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-start;

    padding-top: 65px;

    touch-action: none;

    user-select: none;

    transition:
        transform 0.25s ease,
        opacity 0.25s ease;
}


/* ロック画面の時間 */

.lock-time {

    font-size: 70px;

    font-weight: 300;

    line-height: 1;

    margin: 0;

    color: white;

    text-shadow:
        0 1px 3px rgba(0,0,0,0.5);
}


/* 日付 */

.lock-date {

    margin-top: 14px;

    font-size: 17px;

    color: white;
}


/* 上にスワイプ */

.swipe-text {

    position: absolute;

    bottom: 85px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 14px;

    color: white;

    pointer-events: none;
}

.swipe-arrow {

    display: block;

    font-size: 24px;

    margin-bottom: 5px;
}


/* =========================================================
   パスコード画面
========================================================= */

.passcode-screen {

    position: absolute;

    inset: 0;

    z-index: 90;

    display: none;

    flex-direction: column;

    align-items: center;

    background: #000;

    color: white;

    padding-top: 80px;
}

.passcode-screen.active {
    display: flex;
}

.passcode-title {

    font-size: 19px;

    margin-bottom: 20px;
}

.passcode-dots {

    display: flex;

    gap: 16px;

    margin: 15px 0 30px;
}

.passcode-dot {

    width: 13px;
    height: 13px;

    border-radius: 50%;

    border: 1px solid white;

    background: transparent;
}

.passcode-dot.filled {
    background: white;
}


/* パスワードを忘れた場合 */

.forgot-password {

    margin: 0 0 15px;

    padding: 8px 15px;

    border: none;

    background: transparent;

    color: #aaa;

    font-size: 14px;
}

.forgot-message {

    width: 80%;

    min-height: 50px;

    margin-bottom: 10px;

    text-align: center;

    color: #ddd;

    font-size: 13px;

    line-height: 1.6;
}


/* =========================================================
   スマホ数字キー
========================================================= */

.phone-number-pad {

    width: 270px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;
}

.phone-number-button {

    width: 72px;
    height: 72px;

    margin: auto;

    border: none;

    border-radius: 50%;

    background: #333;

    color: white;

    font-size: 26px;
}

.phone-number-button:active {
    background: #555;
}


/* =========================================================
   ホーム画面
========================================================= */

.home-screen {

    position: absolute;

    inset: 0;

    display: none;

    flex-direction: column;

    background: #111;

    background-size: cover;

    background-position: center;

    z-index: 50;
}

.home-screen.active {
    display: flex;
}


/* アプリ一覧 */

.app-grid {

    padding: 60px 20px 20px;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 25px 15px;
}

.app {

    border: none;

    background: transparent;

    color: white;

    text-align: center;

    font-size: 11px;
}

.app-icon {

    width: 58px;
    height: 58px;

    margin: 0 auto 6px;

    border-radius: 14px;

    background: #333;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 27px;

    color: white;
}


/* =========================================================
   アプリ画面
========================================================= */

.app-screen {

    position: absolute;

    inset: 0;

    z-index: 80;

    display: none;

    flex-direction: column;

    background: #111;
}

.app-screen.active {
    display: flex;
}


/* アプリ内ヘッダー */

.app-header {

    height: 65px;

    min-height: 65px;

    display: flex;

    align-items: center;

    padding: 0 15px;

    background: white;

    color: black;

    border-bottom: 1px solid #ccc;

    z-index: 100;
}


/*
   ★ここが重要

   アプリ内の戻るボタンと
   「スマホ選択へ戻る」ボタンは
   完全に別の場所にする。
*/

.app-back {

    border: none;

    background: transparent;

    color: #007aff;

    font-size: 17px;

    padding: 10px 15px 10px 0;
}

.app-title {

    font-size: 18px;

    font-weight: bold;

    margin-left: 5px;
}


/* アプリ画像 */

.app-image-area {

    flex: 1;

    width: 100%;

    overflow-y: auto;

    display: flex;

    justify-content: center;

    align-items: flex-start;

    background: #111;
}

.app-image {

    display: block;

    width: 100%;

    height: auto;

    min-height: 200px;

    object-fit: contain;

    background: #111;
}


/* 画像がない場合 */

.no-image {

    width: 100%;

    height: 100%;

    min-height: 300px;

    display: flex;

    justify-content: center;

    align-items: center;

    color: #aaa;

    font-size: 14px;

}


/* =========================================================
   LINE
========================================================= */

.line-screen {

    background: #fff;

    color: #111;
}


/* LINE相手一覧 */

.line-list {

    flex: 1;

    overflow-y: auto;

    background: white;
}

.line-person {

    width: 100%;

    min-height: 70px;

    padding: 15px;

    border: none;

    border-bottom: 1px solid #ddd;

    background: white;

    color: #111;

    text-align: left;

    font-size: 16px;
}


/* LINEチャット */

.line-chat-screen {

    position: absolute;

    inset: 0;

    display: none;

    flex-direction: column;

    background: white;

    z-index: 200;
}

.line-chat-screen.active {
    display: flex;
}

.line-chat-image {

    flex: 1;

    width: 100%;

    object-fit: contain;

    background: white;
}


/* =========================================================
   スマホ内アプリ用
========================================================= */

.hidden {
    display: none !important;
}

</style>
</head>


<body>


<!-- =====================================================
     タイトル
===================================================== -->

<section id="titlePage"
         class="page active">

    <h1>
        りゅうせい監禁事件
    </h1>

    <button class="start-button"
            onclick="showPage('menuPage')">
        START
    </button>

</section>



<!-- =====================================================
     メニュー
===================================================== -->

<section id="menuPage"
         class="page">

    <h1>
        メニュー
    </h1>

    <button class="menu-button"
            onclick="showPage('roomSelectPage')">
        容疑者の部屋を調べる
    </button>

    <button class="menu-button"
            onclick="showPage('phoneSelectPage')">
        容疑者のスマホを調べる
    </button>

</section>



<!-- =====================================================
     部屋選択
===================================================== -->

<section id="roomSelectPage"
         class="page">

    <h1>
        容疑者の部屋を調べる
    </h1>

    <button class="room-button"
            onclick="openRoom('misa')">
        101　みさの部屋
    </button>

    <button class="room-button"
            onclick="openRoom('rintaro')">
        102　りんたろうの部屋
    </button>

    <button class="room-button"
            onclick="openRoom('yuuki')">
        202　ゆうきの部屋
    </button>

    <button class="room-button"
            onclick="openRoom('wataru')">
        203　わたるの部屋
    </button>

    <button class="normal-back"
            onclick="showPage('menuPage')">
        ← メニューへ戻る
    </button>

</section>



<!-- =====================================================
     部屋パスワード
===================================================== -->

<section id="roomPasswordPage"
         class="page room-password-page">

    <h2 id="roomPasswordTitle">
        部屋の暗証番号を入力してください
    </h2>

    <div class="room-name"
         id="roomPasswordName">
    </div>

    <div class="password-dots">

        <div class="password-dot"></div>
        <div class="password-dot"></div>
        <div class="password-dot"></div>
        <div class="password-dot"></div>

    </div>

    <div class="number-pad">

        <button class="number-button"
                onclick="roomNumber(1)">1</button>

        <button class="number-button"
                onclick="roomNumber(2)">2</button>

        <button class="number-button"
                onclick="roomNumber(3)">3</button>

        <button class="number-button"
                onclick="roomNumber(4)">4</button>

        <button class="number-button"
                onclick="roomNumber(5)">5</button>

        <button class="number-button"
                onclick="roomNumber(6)">6</button>

        <button class="number-button"
                onclick="roomNumber(7)">7</button>

        <button class="number-button"
                onclick="roomNumber(8)">8</button>

        <button class="number-button"
                onclick="roomNumber(9)">9</button>

        <button class="number-button clear"
                onclick="roomClear()">
            消す
        </button>

        <button class="number-button"
                onclick="roomNumber(0)">0</button>

        <button class="number-button clear"
                onclick="roomClearAll()">
            全消去
        </button>

    </div>

    <div id="roomPasswordMessage"
         class="password-message">
    </div>

    <button class="normal-back"
            onclick="showPage('roomSelectPage')">
        ← 部屋選択へ戻る
    </button>

</section>



<!-- =====================================================
     部屋正解ページ
===================================================== -->

<section id="roomSuccessPage"
         class="page room-success">

    <h2 id="roomSuccessTitle">
    </h2>

    <p>
        ※グループの中で、この部屋を捜査する人を2人決めてください。<br>
        制限時間は2分間です。<br>
        部屋の中のものは自由に撮影してOKです。<br>
        集めた情報はグループで共有してください。
    </p>

    <button class="normal-back"
            onclick="showPage('roomSelectPage')">
        ← 部屋選択へ戻る
    </button>

</section>



<!-- =====================================================
     スマホ選択
===================================================== -->

<section id="phoneSelectPage"
         class="page">

    <h1>
        容疑者のスマホを調べる
    </h1>

    <button class="phone-select-button"
            onclick="openPhone('misa')">
        みさのスマホ
    </button>

    <button class="phone-select-button"
            onclick="openPhone('rintaro')">
        りんたろうのスマホ
    </button>

    <button class="phone-select-button"
            onclick="openPhone('yuuki')">
        ゆうきのスマホ
    </button>

    <button class="phone-select-button"
            onclick="openPhone('wataru')">
        わたるのスマホ
    </button>

    <button class="normal-back"
            onclick="showPage('menuPage')">
        ← メニューへ戻る
    </button>

</section>



<!-- =====================================================
     スマホ本体
===================================================== -->

<section id="phoneScreen">


    <!--
        ★スマホ選択画面へ戻るボタン

        スマホ本体の「外」に配置
        LINEなどの戻るボタンとは重ならない
    -->

    <div class="phone-navigation">

        <button class="phone-list-back"
                onclick="backToPhoneSelect()">
            ‹ スマホ選択へ戻る
        </button>

    </div>


    <!-- スマホ本体 -->

    <div class="phone-wrapper">

        <div class="phone"
             id="phone">


            <!-- =================================================
                 ロック画面
            ================================================= -->

            <div id="lockScreen"
                 class="lock-screen">

                <div class="lock-time"
                     id="lockTime">
                    00:00
                </div>

                <div class="lock-date"
                     id="lockDate">
                    8月22日 土曜日
                </div>

                <div class="swipe-text">

                    <span class="swipe-arrow">
                        ↑
                    </span>

                    上にスワイプしてロック解除

                </div>

            </div>



            <!-- =================================================
                 パスコード画面
            ================================================= -->

            <div id="passcodeScreen"
                 class="passcode-screen">

                <div class="passcode-title">
                    パスコードを入力
                </div>

                <div class="passcode-dots">

                    <div class="passcode-dot"></div>
                    <div class="passcode-dot"></div>
                    <div class="passcode-dot"></div>
                    <div class="passcode-dot"></div>

                </div>

                <button class="forgot-password"
                        onclick="showForgotPassword()">
                    パスワードを忘れた場合
                </button>

                <div id="forgotMessage"
                     class="forgot-message">
                </div>

                <div class="phone-number-pad">

                    <button class="phone-number-button"
                            onclick="phoneNumber(1)">
                        1
                    </button>

                    <button class="phone-number-button"
                            onclick="phoneNumber(2)">
                        2
                    </button>

                    <button class="phone-number-button"
                            onclick="phoneNumber(3)">
                        3
                    </button>

                    <button class="phone-number-button"
                            onclick="phoneNumber(4)">
                        4
                    </button>

                    <button class="phone-number-button"
                            onclick="phoneNumber(5)">
                        5
                    </button>

                    <button class="phone-number-button"
                            onclick="phoneNumber(6)">
                        6
                    </button>

                    <button class="phone-number-button"
                            onclick="phoneNumber(7)">
                        7
                    </button>

                    <button class="phone-number-button"
                            onclick="phoneNumber(8)">
                        8
                    </button>

                    <button class="phone-number-button"
                            onclick="phoneNumber(9)">
                        9
                    </button>

                    <button class="phone-number-button">
                    </button>

                    <button class="phone-number-button"
                            onclick="phoneNumber(0)">
                        0
                    </button>

                    <button class="phone-number-button"
                            onclick="phoneClear()">
                        ×
                    </button>

                </div>

            </div>



            <!-- =================================================
                 ホーム画面
            ================================================= -->

            <div id="homeScreen"
                 class="home-screen">


                <div class="app-grid">


                    <button class="app"
                            onclick="openApp('line')">

                        <div class="app-icon">
                            LINE
                        </div>

                        LINE

                    </button>


                    <button class="app"
                            onclick="openApp('memo')">

                        <div class="app-icon">
                            📝
                        </div>

                        メモ

                    </button>


                    <button class="app"
                            onclick="openApp('safari')">

                        <div class="app-icon">
                            🧭
                        </div>

                        Safari

                    </button>


                    <button class="app"
                            onclick="openApp('photo')">

                        <div class="app-icon">
                            🖼
                        </div>

                        写真

                    </button>


                    <button class="app"
                            onclick="openApp('mail')">

                        <div class="app-icon">
                            ✉
                        </div>

                        メール

                    </button>


                    <button class="app"
                            onclick="openApp('calendar')">

                        <div class="app-icon">
                            📅
                        </div>

                        カレンダー

                    </button>


                    <button class="app"
                            onclick="openApp('map')">

                        <div class="app-icon">
                            🗺
                        </div>

                        マップ

                    </button>


                    <!--
                        他のアプリを増やしたい場合は
                        ここに追加できます
                    -->

                    <button class="app"
                            onclick="openApp('other1')">

                        <div class="app-icon">
                            📁
                        </div>

                        ファイル

                    </button>


                </div>

            </div>



            <!-- =================================================
                 通常アプリ画面
            ================================================= -->

            <div id="normalAppScreen"
                 class="app-screen">


                <div class="app-header">

                    <button class="app-back"
                            onclick="closeApp()">
                        ‹ 戻る
                    </button>

                    <div class="app-title"
                         id="appTitle">
                    </div>

                </div>


                <div class="app-image-area">

                    <img id="appImage"
                         class="app-image"
                         src=""
                         alt="">

                    <div id="noImage"
                         class="no-image">
                        画像を準備中です
                    </div>

                </div>

            </div>



            <!-- =================================================
                 LINE
            ================================================= -->

            <div id="lineScreen"
                 class="app-screen line-screen">


                <div class="app-header">

                    <button class="app-back"
                            onclick="closeApp()">
                        ‹ 戻る
                    </button>

                    <div class="app-title">
                        LINE
                    </div>

                </div>


                <!-- 相手選択 -->

                <div id="lineList"
                     class="line-list">

                </div>


                <!-- チャット -->

                <div id="lineChatScreen"
                     class="line-chat-screen">

                    <div class="app-header">

                        <button class="app-back"
                                onclick="closeLineChat()">
                            ‹ 戻る
                        </button>

                        <div class="app-title"
                             id="lineChatName">
                        </div>

                    </div>

/*

const phoneData = {

/* =========================================================
   現在の状態
========================================================= */

let currentRoom = null;

let roomPasswordInput = "";

let currentPhone = null;

let phonePasswordInput = "";

let currentApp = null;


/* =========================================================
   ページ切り替え
========================================================= */

function showPage(pageId) {

    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.remove("active");

            page.style.display = "";

        });

    const target =
        document.getElementById(pageId);

    if (!target) return;

    target.classList.add("active");

}


/* =========================================================
   部屋
========================================================= */

function openRoom(person) {

    currentRoom = person;

    roomPasswordInput = "";

    updateRoomDots();

    document.getElementById(
        "roomPasswordName"
    ).textContent =
        roomData[person].room +
        "　" +
        roomData[person].name +
        "の部屋";

    document.getElementById(
        "roomPasswordMessage"
    ).textContent = "";

    showPage("roomPasswordPage");
}


function roomNumber(number) {

    if (roomPasswordInput.length >= 4) {
        return;
    }

    roomPasswordInput += number;

    updateRoomDots();

    if (roomPasswordInput.length === 4) {

        setTimeout(
            checkRoomPassword,
            150
        );

    }
}


function roomClear() {

    roomPasswordInput =
        roomPasswordInput.slice(0, -1);

    updateRoomDots();
}


function roomClearAll() {

    roomPasswordInput = "";

    updateRoomDots();
}


function updateRoomDots() {

    const dots =
        document.querySelectorAll(
            ".password-dot"
        );

    dots.forEach(
        (dot, index) => {

            dot.classList.toggle(
                "filled",
                index <
                roomPasswordInput.length
            );

        }
    );
}


function checkRoomPassword() {

    const data =
        roomData[currentRoom];

    if (
        roomPasswordInput ===
        data.password
    ) {

        /*
           正解したら新しいページへ
        */

        document.getElementById(
            "roomSuccessTitle"
        ).textContent =
            "ガチャ…。暗証番号は正しかったようだ。\n" +
            data.name +
            "の部屋を調べろ。";

        showPage("roomSuccessPage");

    } else {

        document.getElementById(
            "roomPasswordMessage"
        ).textContent =
            "暗証番号が違います。";

        roomPasswordInput = "";

        updateRoomDots();

    }

}


/* =========================================================
   スマホを開く
========================================================= */

function openPhone(person) {

    currentPhone = person;

    phonePasswordInput = "";

    currentApp = null;

    const data =
        phoneData[person];


    /* ロック画面画像 */

    const lock =
        document.getElementById(
            "lockScreen"
        );

    if (data.lockImage) {

        lock.style.backgroundImage =
            "url('" +
            data.lockImage +
            "')";

    } else {

        lock.style.backgroundImage =
            "none";

    }


    /* ロック画面 */

    lock.style.display =
        "flex";

    lock.style.transform =
        "translateY(0)";

    lock.style.opacity =
        "1";


    /* パスコード */

    document.getElementById(
        "passcodeScreen"
    ).classList.remove("active");


    /* ホーム */

    document.getElementById(
        "homeScreen"
    ).classList.remove("active");


    /* アプリ */

    document.getElementById(
        "normalAppScreen"
    ).classList.remove("active");

    document.getElementById(
        "lineScreen"
    ).classList.remove("active");


    document.getElementById(
        "forgotMessage"
    ).textContent = "";


    updatePhoneDots();

    document.getElementById(
        "phoneScreen"
    ).classList.add("active");

}


/* =========================================================
   スマホ選択画面へ戻る
========================================================= */

function backToPhoneSelect() {

    currentPhone = null;

    currentApp = null;

    document.getElementById(
        "phoneScreen"
    ).classList.remove("active");

    showPage("phoneSelectPage");

}


/* =========================================================
   スワイプ処理
========================================================= */

let touchStartY = 0;

let touchEndY = 0;


const lockScreen =
    document.getElementById(
        "lockScreen"
    );


lockScreen.addEventListener(
    "touchstart",
    function(event) {

        if (
            !currentPhone ||
            document.getElementById(
                "lockScreen"
            ).style.display === "none"
        ) {
            return;
        }

        touchStartY =
            event.touches[0].clientY;

    },
    { passive: true }
);


lockScreen.addEventListener(
    "touchend",
    function(event) {

        touchEndY =
            event.changedTouches[0].clientY;

        const distance =
            touchStartY -
            touchEndY;


        /*
           50px以上上にスワイプした場合だけ解除
        */

        if (distance > 50) {

            unlockSwipe();

        }

    },
    { passive: true }
);


function unlockSwipe() {

    const lock =
        document.getElementById(
            "lockScreen"
        );

    lock.style.transform =
        "translateY(-100%)";

    lock.style.opacity =
        "0";


    setTimeout(
        function() {

            lock.style.display =
                "none";

            document.getElementById(
                "passcodeScreen"
            ).classList.add("active");

        },
        250
    );

}


/* =========================================================
   スマホパスコード
========================================================= */

function phoneNumber(number) {

    if (
        phonePasswordInput.length >= 4
    ) {
        return;
    }

    phonePasswordInput += number;

    updatePhoneDots();


    if (
        phonePasswordInput.length === 4
    ) {

        setTimeout(
            checkPhonePassword,
            150
        );

    }

}


function phoneClear() {

    phonePasswordInput =
        phonePasswordInput.slice(0, -1);

    updatePhoneDots();

}


function updatePhoneDots() {

    const dots =
        document.querySelectorAll(
            ".passcode-dot"
        );

    dots.forEach(
        (dot, index) => {

            dot.classList.toggle(
                "filled",
                index <
                phonePasswordInput.length
            );

        }
    );

}


function checkPhonePassword() {

    const data =
        phoneData[currentPhone];

    if (
        phonePasswordInput ===
        data.password
    ) {

        document.getElementById(
            "passcodeScreen"
        ).classList.remove(
            "active"
        );

        document.getElementById(
            "homeScreen"
        ).classList.add(
            "active"
        );

        phonePasswordInput = "";

        updatePhoneDots();

    } else {

        phonePasswordInput = "";

        updatePhoneDots();

        /*
           軽く振動
        */

        if (
            navigator.vibrate
        ) {
            navigator.vibrate(100);
        }

    }

}


/* =========================================================
   パスワードを忘れた場合
========================================================= */

function showForgotPassword() {

    const data =
        phoneData[currentPhone];

    document.getElementById(
        "forgotMessage"
    ).textContent =
        data.forgot;

}


/* =========================================================
   アプリを開く
========================================================= */

function openApp(appName) {

    currentApp = appName;


    /* LINE */

    if (appName === "line") {

        document.getElementById(
            "normalAppScreen"
        ).classList.remove(
            "active"
        );

        document.getElementById(
            "lineScreen"
        ).classList.add(
            "active"
        );

        createLineList();

        return;

    }


    /* その他アプリ */

    const data =
        phoneData[currentPhone];

    const image =
        data.apps[appName];


    document.getElementById(
        "appTitle"
    ).textContent =
        getAppName(appName);


    const imageElement =
        document.getElementById(
            "appImage"
        );

    const noImage =
        document.getElementById(
            "noImage"
        );


    if (image) {

        imageElement.src = image;

        imageElement.style.display =
            "block";

        noImage.style.display =
            "none";

    } else {

        imageElement.src = "";

        imageElement.style.display =
            "none";

        noImage.style.display =
            "flex";

    }


    document.getElementById(
        "normalAppScreen"
    ).classList.add(
        "active"
    );

}


function getAppName(appName) {

    const names = {

        memo: "メモ",

        safari: "Safari",

        photo: "写真",

        mail: "メール",

        calendar: "カレンダー",

        map: "マップ",

        other1: "ファイル"

    };

    return names[appName] ||
           appName;

}


/* =========================================================
   通常アプリを閉じる
========================================================= */

function closeApp() {

    document.getElementById(
        "normalAppScreen"
    ).classList.remove(
        "active"
    );

    currentApp = null;

}


/* =========================================================
   LINE相手一覧
========================================================= */

function createLineList() {

    const list =
        document.getElementById(
            "lineList"
        );

    list.innerHTML = "";

    const data =
        phoneData[currentPhone];


    Object.keys(data.line)
        .forEach(
            person => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "line-person";

                button.textContent =
                    person;

                button.onclick =
                    function() {

                        openLineChat(
                            person
                        );

                    };

                list.appendChild(
                    button
                );

            }
        );

}


/* =========================================================
   LINEチャット
========================================================= */

function openLineChat(person) {

    const data =
        phoneData[currentPhone];

    const image =
        data.line[person];


    document.getElementById(
        "lineChatName"
    ).textContent =
        person;


    const chatImage =
        document.getElementById(
            "lineChatImage"
        );


    if (image) {

        chatImage.src =
            image;

    } else {

        chatImage.removeAttribute(
            "src"
        );

    }


    document.getElementById(
        "lineChatScreen"
    ).classList.add(
        "active"
    );

}


/* =========================================================
   LINEチャットから相手選択へ
========================================================= */

function closeLineChat() {

    document.getElementById(
        "lineChatScreen"

        "active"
